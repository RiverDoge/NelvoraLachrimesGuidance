<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forces of Xeryos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="theme-xeryos">

    <!-- Faded Return Button (Fixed Top Left) -->
    <button id="return-btn" class="fixed-return-btn hidden" onclick="returnToGrid()">&#8592; Return</button>

    <header id="main-header">
        <h1>Forces of Xeryos</h1>
    </header>

    <main id="champion-selection">
        <div class="champion-grid" id="grid-container">
            <img src="assets/champion_art/Cherished.png" alt="Cherished" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Cherished', 'Cherished.png')">
            <img src="assets/champion_art/The_Reverent_Heart.png" alt="The Reverent Heart" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('The Reverent Heart', 'The_Reverent_Heart.png')">
            <img src="assets/champion_art/Voice_of_the_Archon.png" alt="Voice of the Archon" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Voice of the Archon', 'Voice_of_the_Archon.png')">
            <img src="assets/champion_art/Scorned_Blades.png" alt="Scorned Blades" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Scorned Blades', 'Scorned_Blades.png')">
            <img src="assets/champion_art/Mornings_Song.png" alt="Morning’s Song" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Morning’s Song', 'Mornings_Song.png')">
            <img src="assets/champion_art/The_Pure.png" alt="The Pure" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('The Pure', 'The_Pure.png')">
            <img src="assets/champion_art/Benevolence.png" alt="Benevolence" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Benevolence', 'Benevolence.png')">
            <img src="assets/champion_art/Virtuous_Storm.png" alt="Virtuous Storm" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Virtuous Storm', 'Virtuous_Storm.png')">
            <img src="assets/champion_art/Blessed_Limb_of_Justice.png" alt="Blessed Limb of Justice" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Blessed Limb of Justice', 'Blessed_Limb_of_Justice.png')">
            <img src="assets/champion_art/Iridescent_Bastion.png" alt="Iridescent Bastion" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Iridescent Bastion', 'Iridescent_Bastion.png')">
            <img src="assets/champion_art/The_Unfurled.png" alt="The Unfurled" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('The Unfurled', 'The_Unfurled.png')">
            <img src="assets/champion_art/Placeholder_12.png" alt="Placeholder 12" class="champion-image-btn" onerror="this.onerror=null; this.src='assets/champion_art/Placeholder_12.png';" onclick="loadChampionData('Placeholder 12', 'Placeholder_12.png')">
        </div>
    </main>

    <section id="champion-details" class="hidden">
        <div class="grimoire-wrapper">
            
            <!-- The Main Manuscript Page -->
            <div class="grimoire-page">
                
                <!-- Inline Title & Art (Always visible) -->
                <div class="grimoire-title-inline">
                    <img id="detail-header-image" src="" alt="Champion Seal" onclick="openLightbox(this.src)">
                    <h2 id="detail-title">Champion Name</h2>
                </div>

                <!-- Manuscript Data -->
                <div class="manuscript-content">
                    <div id="tab-faction" class="tab-content active"></div>
                    <div id="tab-subfactions" class="tab-content"></div>
                    <div id="tab-objectives" class="tab-content"></div>
                    <div id="tab-individuals" class="tab-content"></div>
                </div>
            </div>

           <!-- Inline Title & Art (Flanked) -->
            <div class="grimoire-title-inline">
                <img id="detail-header-image-left" class="header-art-img" src="" alt="Seal Left" onclick="openLightbox(this.src)">
                <h2 id="detail-title">Champion Name</h2>
                <img id="detail-header-image-right" class="header-art-img flipped" src="" alt="Seal Right" onclick="openLightbox(this.src)">
            </div>

        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="hidden" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full Size Art">
    </div>

    <script src="app.js"></script>
</body>
</html>
